name: "Compile UMD for 40 Libraries"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  compile-umd:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install All Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile ALL to UMD with esbuild
        run: node build.mjs

      - name: Download Tailwind CSS 4.3.3 (Play CDN)
        continue-on-error: true
        run: |
          curl -fsSL "https://cdn.tailwindcss.com/4.3.3" -o out/tailwind.js || echo "SKIP tailwind"

      - name: Download Babel Standalone (for JSX in browser)
        continue-on-error: true
        run: |
          curl -fsSL "https://unpkg.com/@babel/standalone@7.28.0/babel.min.js" -o out/babel.min.js || echo "SKIP babel"

      - name: List All Built Files
        run: |
          echo "=== Built UMD Files ==="
          ls -lh out/
          echo "=== Total Size ==="
          du -sh out/

      - name: Create README
        run: |
          cat > out/README.md << 'EOF'
          # 🔥 UMD Bundles - July 2026
          ## Compiled with esbuild from ESM → IIFE/UMD

          ### ✅ Ready for KSWEB (direct <script> use):
          - react-dom.umd.js → React 19.2.8 + ReactDOM (window.React, window.ReactDOM)
          - zustand.umd.js → window.Zustand
          - jotai.umd.js → window.Jotai
          - _reduxjs_toolkit.umd.js → window.RTK
          - react-redux.umd.js → window.ReactRedux
          - _tanstack_react-query.umd.js → window.ReactQuery
          - swr.umd.js → window.SWR
          - react-hook-form.umd.js → window.ReactHookForm
          - framer-motion.umd.js → window.Motion
          - zod.umd.js → window.Zod
          - yup.umd.js → window.Yup
          - axios.umd.js → window.axios
          - dayjs.umd.js → window.dayjs
          - date-fns.umd.js → window.dateFns
          - clsx.umd.js → window.clsx
          - tailwind-merge.umd.js → window.twMerge
          - _supabase_supabase-js.umd.js → window.supabase
          - pocketbase.umd.js → window.PocketBase
          - lucide.umd.js → window.lucide
          - tailwind.js → Tailwind CSS 4.3.3
          - babel.min.js → Babel for JSX

          ### 📱 Usage in KSWEB:
          Copy all .js files to htdocs/libs/ then:

          <script src="libs/react-dom.umd.js"></script>
          <script src="libs/zustand.umd.js"></script>
          <script src="libs/tailwind.js"></script>
          <script src="libs/babel.min.js"></script>

          ### ⚠️ Load Order Matters:
          1. react-dom.umd.js FIRST (always)
          2. Then React-dependent libs (zustand, jotai, etc.)
          3. Standalone libs can go anywhere
          EOF

      - name: ZIP Everything
        run: |
          cd out
          zip -r ../umd-40-libs-july-2026.zip .
          cd ..
          ls -lh umd-40-libs-july-2026.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "umd-${{ github.run_number }}"
          name: "🔥 UMD Bundle #${{ github.run_number }} - July 2026"
          body: |
            ## All 40 Libraries Compiled to UMD/IIFE
            ### Using esbuild - Ready for KSWEB

            **Core:** React 19.2.8, ReactDOM 19.2.8
            **State:** Zustand 5.0.14, Jotai 2.20.2, Redux Toolkit 2.12.0
            **Data:** TanStack Query 5.101.4, SWR 2.4.2
            **Forms:** React Hook Form 7.83.0, Zod 4.4.3, Yup 1.7.1
            **Animation:** Framer Motion 12.42.2
            **Utils:** Axios 1.19.0, Day.js 1.11.21, date-fns 4.4.0
            **Backend:** Supabase 2.111.0, PocketBase 0.27.0
            **Styling:** Tailwind CSS 4.3.3

            Download the ZIP, extract, copy to htdocs/libs/
          files: |
            umd-40-libs-july-2026.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
